---
# This role manages bootloader files and package state. It intentionally does
# not set become; callers must provide privilege externally when required.
- name: Execute role tasks
  tags:
    - grub
    - install
    - config
    - service
    - validate
  block:
    - name: Include assert tasks
      ansible.builtin.include_tasks: assert.yml
      run_once: true
      tags:
        - grub
        - validate

    - name: Install grub packages on Debian family systems
      ansible.builtin.apt:
        name: "{{ grub_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_facts['os_family'] == 'Debian'
        - (ansible_facts['virtualization_type'] | default('')) not in _container_types
      tags:
        - grub
        - install

    - name: Install grub packages on non-Debian systems
      ansible.builtin.package:
        name: "{{ grub_packages }}"
        state: present
      when:
        - ansible_facts['os_family'] != 'Debian'
        - (ansible_facts['virtualization_type'] | default('')) not in _container_types
      tags:
        - grub
        - install

    - name: Include grub configuration tasks
      ansible.builtin.include_tasks: grub.yml
      tags:
        - grub
        - config

    - name: Include grub kernel option management tasks
      ansible.builtin.include_tasks: options_mgmt.yml
      tags:
        - grub
        - config

    - name: Flush grub handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - grub
        - service
